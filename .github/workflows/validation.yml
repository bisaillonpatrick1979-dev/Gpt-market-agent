name: Diagnostic ESLint après correction

on:
  pull_request:

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_validation_locale
  APP_URL: http://localhost:3000

jobs:
  diagnostiquer:
    name: Capturer l’erreur ESLint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Régénérer le verrouillage corrigé
        run: npm install --no-audit --no-fund

      - name: Vérifier l’audit complet
        run: npm audit --audit-level=high

      - name: Capturer le diagnostic ESLint
        run: npm run lint > lint-result.txt 2>&1 || true

      - name: Enregistrer le diagnostic temporaire
        run: |
          rm -f audit-complet.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json audit-complet.json lint-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: enregistrer le diagnostic ESLint temporaire"
            git push origin HEAD:${{ github.head_ref }}
          fi
