name: Diagnostic de sécurité de la phase 0

on:
  pull_request:

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_validation_locale
  APP_URL: http://localhost:3000

jobs:
  diagnostiquer:
    name: Générer le rapport d’audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund

      - name: Générer le rapport d’audit
        run: npm audit --omit=dev --json > audit-result.json || true

      - name: Enregistrer le rapport temporaire
        run: |
          if [ -n "$(git status --porcelain audit-result.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audit-result.json
            git commit -m "chore: enregistrer le diagnostic de sécurité"
            git push origin HEAD:${{ github.head_ref }}
          fi
