name: Validation complète de la phase 0

on:
  pull_request:

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_validation_locale
  APP_URL: http://localhost:3000

jobs:
  valider:
    name: Audit complet, lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Régénérer le verrouillage corrigé
        run: npm install --no-audit --no-fund

      - name: Auditer toutes les dépendances
        run: npm audit --audit-level=high

      - name: Vérifier le code avec ESLint
        run: npm run lint

      - name: Exécuter les tests
        run: npm run test

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Construire l’application
        run: npm run build

      - name: Enregistrer le verrouillage et retirer les diagnostics
        run: |
          rm -f audit-complet.json lint-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A package-lock.json audit-complet.json lint-result.txt
          if ! git diff --cached --quiet; then
            git commit -m "fix: verrouiller les dépendances corrigées"
            git push origin HEAD:${{ github.head_ref }}
          fi
