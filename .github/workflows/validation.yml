name: Diagnostic complet des dépendances

on:
  pull_request:

permissions:
  contents: write

env:
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_validation_locale
  APP_URL: http://localhost:3000

jobs:
  diagnostiquer:
    name: Audit complet des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la branche de travail
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci --no-audit --no-fund

      - name: Générer l’audit complet
        run: npm audit --json > audit-complet.json || true

      - name: Enregistrer le diagnostic temporaire
        run: |
          if [ -n "$(git status --porcelain audit-complet.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add audit-complet.json
            git commit -m "chore: enregistrer l’audit complet temporaire"
            git push origin HEAD:${{ github.head_ref }}
          fi
