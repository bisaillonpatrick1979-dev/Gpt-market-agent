name: Publication initiale de la phase 0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  publier:
    name: Construire, valider et publier
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_validation_initiale
      APP_URL: http://localhost:3000
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruire les fichiers de la phase 0
        run: |
          cat .bootstrap/part-* > /tmp/projet.tar.gz.b64
          base64 --decode /tmp/projet.tar.gz.b64 > /tmp/projet.tar.gz
          tar -xzf /tmp/projet.tar.gz

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer et verrouiller les dépendances
        run: npm install --no-audit --no-fund

      - name: Exécuter les tests
        run: npm run test

      - name: Vérifier TypeScript
        run: npm run typecheck

      - name: Construire l’application
        run: npm run build

      - name: Finaliser les fichiers permanents
        run: |
          sed -i 's/run: npm install --no-audit --no-fund/run: npm ci/' .github/workflows/validation.yml
          sed -i '/verrouillage des dépendances doit être régénéré/d' NOTES.md
          rm -rf .bootstrap .github/workflows/bootstrap.yml

      - name: Commiter et pousser la phase 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: construire les fondations de la phase 0"
          git push origin main
